name: CI

on:
  pull_request:
    branches: [ main, develop ]
    types: [ opened, synchronize, reopened ]

jobs:
  build:
    runs-on: xcode-27 # iPhone Duo requires the iOS 27.1 SDK (Xcode 27.1 or later)
    defaults:
      run:
        # Runs as `bash -eo pipefail` so xcodebuild failures are not masked by the formatter pipe
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Set up Xcode 27
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27'

      - name: Install xcbeautify
        run: command -v xcbeautify || brew install xcbeautify

      - name: List available simulators
        run: xcrun simctl list devices available

      - name: Build for iPhone Duo
        run: |
          xcodebuild -workspace TicTacToe.xcworkspace -scheme TicTacToe \
            -destination 'platform=iOS Simulator,name=iPhone Duo' \
            CODE_SIGNING_ALLOWED=NO clean build | xcbeautify

      - name: Build for macOS
        run: |
          xcodebuild -workspace TicTacToe.xcworkspace -scheme TicTacToe \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO build | xcbeautify
