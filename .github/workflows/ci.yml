name: CI

on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened ]

jobs:
  build:
    runs-on: xcode-27 # iPhone Duo requires the iOS 27.1 SDK (Xcode 27.1 or later)
    steps:
      - uses: actions/checkout@v4

      - name: Set up Xcode 27
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Install xcpretty
        run: gem install xcpretty

      - name: List available simulators
        run: xcrun simctl list devices

      - name: Build for iPhone Duo
        run: |
          set -o pipefail
          xcodebuild -workspace TicTacToe.xcworkspace -scheme TicTacToe \
            -destination 'platform=iOS Simulator,name=iPhone Duo' \
            CODE_SIGNING_ALLOWED=NO clean build | xcpretty

      - name: Build for macOS
        run: |
          set -o pipefail
          xcodebuild -workspace TicTacToe.xcworkspace -scheme TicTacToe \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO build | xcpretty

