name: TicTacToeCore Tests

on:
  pull_request:
    paths:
      - 'TicTacToeCore/**'
      - '.github/workflows/**'

jobs:
  test:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v3

      - name: Set up Xcode 27
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Run unit tests
        run: swift test --package-path TicTacToeCore
